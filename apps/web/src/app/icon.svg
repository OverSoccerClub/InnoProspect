<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Favicon via convenção de metadata do App Router (Next detecta
    app/icon.svg sozinho e gera <link rel="icon"> — nenhuma config em
    layout.tsx precisa mudar). Reaproveita o MESMO glifo (lucide "radar")
    e o MESMO par de cor primary/primary-foreground usado no badge de marca
    do Sidebar/Topbar/login (`bg-primary text-primary-foreground`) — não é
    uma marca nova, é a marca existente miniaturizada. O fundo quadrado
    arredondado e opaco (não o ícone sozinho sobre transparente) é o que
    garante legibilidade tanto em aba de navegador clara quanto escura: a
    cor não depende do tema do SO, só do próprio quadrado.
    Hex vem direto de DESIGN-SYSTEM.md §1.3 (par já verificado em WCAG,
    6.12:1 — mesmo par do botão/StatBand, nenhum contraste novo a calcular).
  -->
  <rect width="24" height="24" rx="6" fill="#0066a3" />
  <g
    transform="translate(3.6 3.6) scale(0.7)"
    fill="none"
    stroke="#fcfcfc"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M19.07 4.93A10 10 0 0 0 6.99 3.34" />
    <path d="M4 6h.01" />
    <path d="M2.29 9.62A10 10 0 1 0 21.31 8.35" />
    <path d="M16.24 7.76A6 6 0 1 0 8.23 16.67" />
    <path d="M12 18h.01" />
    <path d="M17.99 11.66A6 6 0 0 1 15.77 16.67" />
    <circle cx="12" cy="12" r="2" />
    <path d="m13.41 10.59 5.66-5.66" />
  </g>
</svg>
