# infra/docker-compose.yml
#
# ╔══════════════════════════════════════════════════════════════════════╗
# ║ ⚠️  ISTO NÃO É A PRODUÇÃO. A PRODUÇÃO É O EASYPANEL.                  ║
# ║  Este arquivo NUNCA subiu, não é monitorado, não recebe deploy, e     ║
# ║  não reflete necessariamente o estado real do ambiente que os         ║
# ║  clientes usam. Se você está depurando um incidente de produção,      ║
# ║  FECHE este arquivo e vá para `DEPLOY.md` — lá está o que realmente   ║
# ║  está no ar (serviços avulsos criados na UI do EasyPanel).            ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Uso deste arquivo (só desenvolvimento local, opcional): validar que os
# MESMOS Dockerfiles que o EasyPanel vai buildar (`apps/web/Dockerfile`,
# `apps/worker/Dockerfile`) sobem e conversam entre si (web+worker+postgres+
# redis+Evolution), numa máquina com Docker disponível — coisa que nunca foi
# testada nesta máquina de desenvolvimento (sem Docker instalado aqui).
#
# NÃO substitui `infra/docker-compose.dev.yml` (esse sim é o usado no dia a
# dia: só sobe postgres+redis para rodar `pnpm dev` fora de container).
#
# NÃO é o mecanismo de deploy do EasyPanel — lá cada serviço é criado
# individualmente pela UI (um container por serviço, cada um com seu próprio
# Dockerfile/imagem/env, health check e rollback próprios), não por este
# compose. Ver `DEPLOY.md` para o passo a passo real do EasyPanel.
#
# Uso:
#   cp ../.env.example ../.env.local   # preencha os valores
#   docker compose -f infra/docker-compose.yml --env-file ../.env.local up -d --build
#   docker compose -f infra/docker-compose.yml down          # mantém volumes
#   docker compose -f infra/docker-compose.yml down -v        # apaga dados também
#
# ⚠️ NÃO validado com `docker compose up` nesta máquina (sem Docker instalado).
# Sintaxe revisada manualmente — rodar `docker compose -f infra/docker-compose.yml
# config` antes de confiar 100%.
#
# As variáveis de ambiente nativas da Evolution API (AUTHENTICATION_*,
# DATABASE_*, CACHE_REDIS_*, WEBHOOK_*) abaixo foram conferidas contra o
# `.env.example` oficial da tag `2.3.7` do repositório
# `evolution-foundation/evolution-api` (ver comentário na definição do
# serviço `evolution` abaixo) em 2026-08-03. Se você pinar uma versão
# diferente, confira de novo — essas chaves mudam entre versões.

name: innoprospect-local-validation

networks:
  # Evolution API, Postgres e Redis não são expostos publicamente — só o
  # `web` e o `worker` falam com eles, dentro da rede Docker interna
  # (ARQUITETURA.md §9.1 R4 / Fase 3.3: "rede interna não exposta").
  internal:
    internal: true
  public:

services:
  postgres:
    image: postgres:16-alpine
    container_name: innoprospect-postgres
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-innoprospect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-innoprospect}
    volumes:
      - innoprospect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-innoprospect} -d ${POSTGRES_DB:-innoprospect}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: innoprospect-redis
    restart: unless-stopped
    networks: [internal]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - innoprospect_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  evolution:
    # Versão PINADA de propósito (ARQUITETURA.md §9.1, risco R4) — nunca
    # `latest`. CONFIRMADA em 2026-08-03 (Vulcano, com acesso à rede):
    #
    # 1. O projeto mudou de organização/marca: era `EvolutionAPI/evolution-api`
    #    (imagem `atendai/evolution-api`), agora é
    #    `evolution-foundation/evolution-api` ("Evolution Foundation").
    #    A imagem `atendai/evolution-api` ficou ÓRFÃ — o último push lá foi em
    #    2025-06 e ela NUNCA recebeu nada além da v2.2.3 (a versão que estava
    #    aqui como "chute"). Quem publica as versões atuais é
    #    `evoapicloud/evolution-api` (confirmado no `docker-compose.yaml`
    #    oficial do repositório, branch `main`).
    # 2. Última tag ESTÁVEL (não release-candidate) confirmada via GitHub
    #    Releases em 2026-08-03: `v2.3.7` (publicada 2025-12-05). Existem
    #    `2.4.0-rc1`/`2.4.0-rc2` (2026-05, prerelease) — NÃO use, é RC.
    # 3. As chaves de ambiente abaixo foram conferidas contra o
    #    `.env.example` real da tag `2.3.7` do repo (não documentação
    #    desatualizada). Uma mudou: `DATABASE_ENABLED` NÃO existe mais nesse
    #    `.env.example` (a versão v2.2.x que originou este arquivo tinha essa
    #    flag) — deixei a variável abaixo por precaução (imagens costumam
    #    ignorar env var desconhecida), mas ACOMPANHE o log de boot do
    #    primeiro `up`: se aparecer aviso de env var não reconhecida, remova.
    #    Se quiser conferir de novo no futuro:
    #    https://github.com/evolution-foundation/evolution-api/blob/2.3.7/.env.example
    #    (repare: a tag git é `2.3.7` sem "v", mesmo a release no GitHub
    #    mostrando "v2.3.7").
    image: ${EVOLUTION_API_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    container_name: innoprospect-evolution
    restart: unless-stopped
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:?defina EVOLUTION_SERVER_URL (URL pública/interna deste serviço)}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      # Ver nota (1) acima — pode estar obsoleta na 2.3.7, deixada por
      # precaução. Confirme no log de boot.
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      # ⚠️ Banco "evolution" SEPARADO do banco "innoprospect" do app, no MESMO
      # Postgres — o container `postgres` acima só cria o DB declarado em
      # POSTGRES_DB (innoprospect) na primeira subida. Crie o banco "evolution"
      # manualmente antes do primeiro `up` (`docker exec -it innoprospect-postgres
      # psql -U <user> -c "CREATE DATABASE evolution;"`) ou troque por um
      # segundo serviço Postgres dedicado — mais simples de operar no
      # EasyPanel (ver DEPLOY.md).
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-innoprospect}:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_SAVE_INSTANCES: "true"
      WEBHOOK_GLOBAL_ENABLED: "false" # webhook é configurado POR INSTÂNCIA (apps/worker cria via API), não global
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - innoprospect_evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .. # raiz do monorepo — obrigatório (ver apps/web/Dockerfile)
      dockerfile: apps/web/Dockerfile
    image: innoprospect-web
    container_name: innoprospect-web
    restart: unless-stopped
    networks: [internal, public]
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-innoprospect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-innoprospect}
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: http://evolution:8080
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .. # raiz do monorepo — obrigatório (ver apps/worker/Dockerfile)
      dockerfile: apps/worker/Dockerfile
    image: innoprospect-worker
    container_name: innoprospect-worker
    restart: unless-stopped
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution:
        condition: service_started
    env_file:
      - ../.env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-innoprospect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-innoprospect}
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: http://evolution:8080
    # Sem healthcheck HTTP (worker não expõe porta) — a saúde real dele é
    # medida pelo `ScraperHealthEvent`/canário (ARQUITETURA §5.6, Fase 2) e
    # pelo monitoramento pós-deploy do Vulcano (Fase 5.6), não por um
    # healthcheck de container aqui.

volumes:
  innoprospect_postgres_data:
    name: innoprospect_postgres_data
  innoprospect_redis_data:
    name: innoprospect_redis_data
  innoprospect_evolution_instances:
    name: innoprospect_evolution_instances
